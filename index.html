*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;background:radial-gradient(circle at 50% 0%,#1b2350,#0a0d1f 70%);color:#fff;min-height:100vh;display:flex;justify-content:center;padding:16px}
#app{width:100%;max-width:560px}
.screen{display:flex;flex-direction:column;gap:14px;animation:fade .25s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.logo{font-size:30px;font-weight:900;text-align:center;background:linear-gradient(90deg,#7cf,#a8f,#fc8);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:2px}
.sub{text-align:center;color:#9fb0d8;font-size:13px}
.lvlbox{text-align:center;background:#1a2350;border:1px solid #33427f;border-radius:12px;padding:10px;font-weight:700;color:#9fe}
.lvlbox span{color:#7cf;font-size:12px;margin-left:6px}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:linear-gradient(160deg,#212a5c,#161c3d);border:1px solid #3a4a8c;border-radius:16px;padding:16px;color:#fff;font-size:17px;font-weight:700;text-align:left;cursor:pointer;transition:.15s;display:flex;justify-content:space-between;align-items:center}
.card:hover:not(:disabled){transform:translateY(-2px);border-color:#6cf;box-shadow:0 6px 20px #0af3}
.card:disabled{opacity:.42;cursor:not-allowed}
.card small{font-size:11px;color:#8ea2d0;font-weight:400}
.title{font-size:18px;font-weight:800;text-align:center;color:#cfe0ff}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.back{background:none;border:none;color:#7cf;font-size:14px;cursor:pointer;text-align:left;padding:4px}
.hud{display:flex;justify-content:space-between;align-items:center;font-weight:800}
.hearts{font-size:18px;letter-spacing:2px}
.score{color:#ffd76a}
.timerbar{height:10px;background:#20274a;border-radius:99px;overflow:hidden}
.timerbar>i{display:block;height:100%;width:100%;background:linear-gradient(90deg,#4ef,#7cf,#f6a);border-radius:99px}
.qmeta{font-size:12px;color:#8ea2d0;text-align:center}
.qtext{background:linear-gradient(160deg,#232c62,#151a38);border:1px solid #3a4a8c;border-radius:18px;padding:26px 16px;font-size:20px;font-weight:800;text-align:center;line-height:1.5;min-height:110px;display:flex;align-items:center;justify-content:center;word-break:break-word}
.choices{display:flex;flex-direction:column;gap:10px}
.choice{background:#1b2350;border:2px solid #3a4a8c;border-radius:14px;padding:15px;color:#fff;font-size:17px;font-weight:700;cursor:pointer;transition:.12s;text-align:center}
.choice:hover:not(:disabled){border-color:#6cf;background:#223066}
.choice.correct{background:#12603a;border-color:#2ee98a;animation:pop .3s}
.choice.wrong{background:#6a1b2a;border-color:#ff5d7a;animation:shake .3s}
@keyframes pop{50%{transform:scale(1.05)}}
@keyframes shake{25%{transform:translateX(-7px)}75%{transform:translateX(7px)}}
.combo{text-align:center;font-weight:900;color:#ffd76a;height:20px}
.rank{font-size:52px;text-align:center}
.stars{text-align:center;font-size:34px;letter-spacing:6px}
.stat{display:flex;justify-content:space-between;background:#1a2350;border:1px solid #33427f;border-radius:12px;padding:12px 16px;font-weight:700}
.stat b{color:#7cf}

const app = document.getElementById('app');

const shuffle = a => { for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; };

let save = {xp:0};
try{ const s=localStorage.getItem('manabi'); if(s) save=JSON.parse(s); }catch(e){}
const persist = ()=>{ try{localStorage.setItem('manabi',JSON.stringify(save));}catch(e){} };
const levelOf = xp => Math.floor(xp/1000)+1;

let S = {stage:null, grade:null, dept:null, subject:null, unit:null};
let QZ = null;

let AC=null;
function beep(freq, dur=0.12, type='sine'){
  try{
    AC = AC || new (window.AudioContext||window.webkitAudioContext)();
    const o=AC.createOscillator(), g=AC.createGain();
    o.type=type; o.frequency.value=freq;
    o.connect(g); g.connect(AC.destination);
    g.gain.setValueAtTime(0.08, AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, AC.currentTime+dur);
    o.start(); o.stop(AC.currentTime+dur);
  }catch(e){}
}

function renderGrades(){
  const list = S.stage==='elem' ? [1,2,3,4,5,6] : [1,2,3];
  const name = S.stage==='elem' ? '小学' : '中学';
  app.innerHTML = `
  <div class="screen">
    <button class="back" data-act="home">← もどる</button>
    <div class="title">学年をえらぼう</div>
    <div class="grid">
      ${list.map(g=>`<button class="card" data-act="grade" data-v="${g}">${name}${g}年</button>`).join('')}
    </div>
  </div>`;
}

function renderDepts(){
  app.innerHTML = `
  <div class="screen">
    <button class="back" data-act="home">← もどる</button>
    <div class="title">学科をえらぼう</div>
    <div class="cards">
      ${Object.keys(HS).map(d=>`<button class="card" data-act="dept" data-v="${esc(d)}">${esc(d)}</button>`).join('')}
    </div>
  </div>`;
}

function renderSubjects(){
  let subjects, title;
  if(S.stage==='elem'){ subjects = Object.keys(ELEM[S.grade]); title = `小${S.grade}の教科`; }
  else if(S.stage==='jr'){ subjects = Object.keys(JHS[S.grade]); title = `中${S.grade}の教科`; }
  else { subjects = Object.keys(HS[S.dept]); title = `${S.dept}の教科`; }
  app.innerHTML = `
  <div class="screen">
    <button class="back" data-act="${S.stage==='hs'?'depts':'grades'}">← もどる</button>
    <div class="title">${esc(title)}</div>
    <div class="cards">
      ${subjects.map(s=>`<button class="card" data-act="subject" data-v="${esc(s)}">${esc(s)}</button>`).join('')}
    </div>
  </div>`;
}

function keyOf(unit){
  if(S.stage==='elem') return `E${S.grade}|${S.subject}|${unit}`;
  if(S.stage==='jr')   return `J${S.grade}|${S.subject}|${unit}`;
  return `H|${S.dept}|${S.subject}|${unit}`;
}
function renderUnits(){
  let units;
  if(S.stage==='elem') units = ELEM[S.grade][S.subject];
  else if(S.stage==='jr') units = JHS[S.grade][S.subject];
  else units = HS[S.dept][S.subject];
  app.innerHTML = `
  <div class="screen">
    <button class="back" data-act="subjects">← もどる</button>
    <div class="title">${esc(S.subject)} の単元</div>
    <div class="cards">
      ${units.map(u=>{
        const has = !!QB[keyOf(u)];
        return `<button class="card" data-act="unit" data-v="${esc(u)}" ${has?'':'disabled'}>
          ${esc(u)} <small>${has?'50問 ▸':'準備中 🔒'}</small></button>`;
      }).join('')}
    </div>
  </div>`;
}

function startQuiz(unit){
  const key = keyOf(unit);
  const bank = QB[key];
  if(!bank){ alert('この単元は準備中です'); return; }
  const picked = shuffle(bank.slice()).slice(0,10);
  QZ = {
    title: unit,
    list: picked.map(a=>({q:a[0], correct:a[1], choices: shuffle([a[1],a[2],a[3],a[4]])})),
    i:0, score:0, combo:0, maxCombo:0, hearts:3, correct:0, timeLeft:0, tid:null
  };
  renderQuiz();
}

function renderQuiz(){
  if(QZ.i >= QZ.list.length || QZ.hearts <= 0) return renderResult();
  const cur = QZ.list[QZ.i];
  app.innerHTML = `
  <div class="screen">
    <div class="hud">
      <div class="hearts">${'❤️'.repeat(QZ.hearts)}${'🖤'.repeat(3-QZ.hearts)}</div>
      <div class="score">${QZ.score} pt</div>
    </div>
    <div class="timerbar"><i></i></div>
    <div class="qmeta">${esc(QZ.title)} ・ ${QZ.i+1} / ${QZ.list.length}</div>
    <div class="qtext">${esc(cur.q)}</div>
    <div class="choices">
      ${cur.choices.map((c,i)=>`<button class="choice" data-act="ans" data-i="${i}">${esc(c)}</button>`).join('')}
    </div>
    <div class="combo" id="combo">${QZ.combo>=2?QZ.combo+' COMBO!':''}</div>
  </div>`;
  startTimer();
}

function startTimer(){
  clearInterval(QZ.tid);
  const TOTAL = 20000, t0 = Date.now();
  QZ.timeLeft = TOTAL;
  QZ.tid = setInterval(()=>{
    const left = TOTAL - (Date.now()-t0);
    QZ.timeLeft = Math.max(0,left);
    const bar = document.querySelector('.timerbar > i');
    if(bar) bar.style.width = (QZ.timeLeft/TOTAL*100) + '%';
    if(left <= 0){ clearInterval(QZ.tid); answer(null); }
  }, 50);
}

function answer(idx){
  clearInterval(QZ.tid);
  const cur = QZ.list[QZ.i];
  const btns = [...document.querySelectorAll('.choice')];
  btns.forEach((b,i)=>{
    b.disabled = true;
    if(cur.choices[i] === cur.correct) b.classList.add('correct');
  });
  const ok = idx !== null && cur.choices[idx] === cur.correct;
  if(ok){
    QZ.correct++;
    QZ.combo++;
    QZ.maxCombo = Math.max(QZ.maxCombo, QZ.combo);
    QZ.score += 100 + QZ.combo*20 + Math.floor(QZ.timeLeft/1000)*10;
    beep(880,0.1);
    setTimeout(()=>beep(1180,0.1),90);
  }else{
    QZ.combo = 0;
    QZ.hearts--;
    if(idx !== null) btns[idx].classList.add('wrong');
    beep(180,0.2,'square');
  }
  const h = document.querySelector('.hearts');
  if(h) h.textContent = '❤️'.repeat(QZ.hearts) + '🖤'.repeat(3-QZ.hearts);
  const sc = document.querySelector('.score');
  if(sc) sc.textContent = QZ.score + ' pt';
  const cb = document.getElementById('combo');
  if(cb) cb.textContent = ok && QZ.combo>=2 ? QZ.combo+' COMBO!' : '';

  setTimeout(()=>{ QZ.i++; renderQuiz(); }, 950);
}

function renderResult(){
  const total = QZ.list.length;
  const acc = Math.round(QZ.correct / total * 100);
  const stars = acc>=90?3 : acc>=70?2 : acc>=50?1 : 0;
  const rank = stars===3?'🏆':stars===2?'🥇':stars===1?'🥈':'💪';
  save.xp += QZ.score; persist();
  beep(stars>=2?1046:392, 0.25);
  app.innerHTML = `
  <div class="screen">
    <div class="rank">${rank}</div>
    <div class="stars">${'★'.repeat(stars)}${'☆'.repeat(3-stars)}</div>
    <div class="title">${esc(QZ.title)} クリア！</div>
    <div class="stat"><span>スコア</span><b>${QZ.score} pt</b></div>
    <div class="stat"><span>正解数</span><b>${QZ.correct} / ${total}</b></div>
    <div class="stat"><span>正答率</span><b>${acc}%</b></div>
    <div class="stat"><span>最大コンボ</span><b>${QZ.maxCombo}</b></div>
    <div class="stat"><span>総XP / Lv</span><b>${save.xp} XP ・ Lv.${levelOf(save.xp)}</b></div>
    <div class="cards">
      <button class="card" data-act="retry">🔁 もう一度ちょうせん</button>
      <button class="card" data-act="units">📚 単元をえらぶ</button>
      <button class="card" data-act="home">🏠 ホームへ</button>
    </div>
  </div>`;
}

app.addEventListener('click', e=>{
  const b = e.target.closest('[data-act]');
  if(!b || b.disabled) return;
  const act = b.dataset.act, v = b.dataset.v;
  switch(act){
    case 'home': renderStart(); break;
    case 'stage': S={stage:v,grade:null,dept:null,subject:null,unit:null}; (v==='hs')?renderDepts():renderGrades(); break;
    case 'grades': renderGrades(); break;
    case 'depts': renderDepts(); break;
    case 'grade': S.grade=Number(v); renderSubjects(); break;
    case 'dept': S.dept=v; renderSubjects(); break;
    case 'subjects': renderSubjects(); break;
    case 'subject': S.subject=v; renderUnits(); break;
    case 'unit': startQuiz(v); break;
    case 'ans': answer(Number(b.dataset.i)); break;
    case 'retry': startQuiz(QZ.title); break;
    case 'units': renderUnits(); break;
  }
});

renderStart();
</script>
</body>
</html>
